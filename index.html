<h1>KPIシート連携</h1>
<p>「KPIシート連携」は、YouTubeチャンネルの運用を支援するために、チャンネル所有者の許可を得て YouTube の分析データ（視聴回数・登録者数など）を読み取り、運用チームの社内資料（KPIシート、週報、分析資料など）にまとめるための社内ツールです。</p>
<p>一般向けのサービスではなく、運用を受託しているチャンネルでのみ使用します。</p>
<ul>
<li>読み取りのみを行い、動画やチャンネルの変更・削除・投稿は行いません。</li>
<li>取得したデータは、チャンネル所有者への報告と運用改善のためだけに使います。</li>
</ul>
